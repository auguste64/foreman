                - generic [ref=e172]: Contenu
                - textbox [ref=e173]: Les honoraires sont fixés dans le devis ou contrat d'honoraires signé entre les parties. Ils sont exprimés en euros hors taxes. La TVA applicable est celle en vigueur au jour de la facturation. Toute prestation supplémentaire non prévue dans le périmètre initial fera l'objet d'un avenant précisant les nouvelles prestations et les honoraires correspondants.
