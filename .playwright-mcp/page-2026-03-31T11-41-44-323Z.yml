                - textbox [ref=e197]: La responsabilité du Prestataire est limitée au montant des honoraires perçus au titre de la mission concernée, sauf faute lourde ou dolosive. Le Prestataire ne peut être tenu responsable des dommages indirects ou consécutifs. Le Prestataire dispose d'une assurance responsabilité civile professionnelle couvrant les risques liés à l'exercice de ses activités. Les coordonnées de l'assureur figurent dans la section d'identification du prestataire.
