                - generic [ref=e160]: Contenu
                - textbox [ref=e161]: Les présentes conditions générales de prestation de services (ci-après « CGP ») ont pour objet de définir les modalités et conditions dans lesquelles le Prestataire réalise des missions de maîtrise d'œuvre et de conseil en architecture au profit de ses clients (ci-après « le Maître d'Ouvrage »). Toute commande passée auprès du Prestataire implique l'acceptation sans réserve des présentes CGP. Les présentes CGP prévalent sur tout autre document, sauf accord écrit et préalable du Prestataire.
