                - generic [ref=e184]: Contenu
                - textbox [ref=e185]: Sauf stipulation contraire, les factures sont payables à réception dans un délai de 30 jours. Le paiement s'effectue par virement bancaire ou chèque. Tout retard de paiement donnera lieu, de plein droit et sans mise en demeure préalable, à des pénalités de retard calculées au taux légal majoré de 3 points, ainsi qu'à une indemnité forfaitaire de recouvrement de 40 €. En cas de retard persistant, le Prestataire se réserve le droit de suspendre l'exécution de la mission.
